<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NU-Track | NextUtility Treatment</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#16a34a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:12px}
.ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(to top right,#22c55e,#0ea5e9);display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:18px;height:18px}
.br b{display:block;font-size:17px;letter-spacing:-.02em;line-height:1.1}.br span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);font-weight:600}
.pill{margin-left:auto;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:3px 10px;white-space:nowrap}
#map{height:46vh;min-height:280px;width:100%}
main{max-width:860px;margin:0 auto;padding:14px 14px 30px}
.ctl{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.ctl button{border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;padding:8px 14px;cursor:pointer;min-width:84px}
.ctl input{flex:1}.clock{font-weight:700;font-size:20px;min-width:62px;text-align:right}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;cursor:pointer;border-left:6px solid var(--c)}
.card.on{outline:2px solid var(--c)}
.card h3{margin:0;font-size:15px;display:flex;align-items:center}.card h3 small{margin-left:auto;font-weight:400;color:var(--mu)}
.st{font-size:13px;color:var(--mu);margin:2px 0 0}.tt{display:none;margin-top:8px;border-top:1px solid var(--bd);padding-top:6px;font-size:13px}
.card.on .tt{display:block}.tt div{display:flex;gap:8px;padding:2px 0}.tt b{min-width:44px}
h2{font-size:15px;margin:4px 0 8px}
.br span{white-space:nowrap}@media(max-width:430px){.pill{display:none}}
</style>
</head>
<body>
<header>
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20a10 10 0 0010-10 25.9 25.9 0 00-1.04-7.281 1 1 0 00-1.755-.325C15.833 5.5 13 5.5 9.8 6.1A7 7 0 0011 20"/><path d="M2 21a5 5 0 012.911-4.544C7.613 15.212 8.351 15.24 11 13"/></svg></div>
<div class="br"><b>NU-Track</b><span>Logistika a distribuce</span></div><div class="pill">Pouze pro oprávněné</div>
</header>
<div id="map"></div>
<main>
<div class="ctl"><button id="play" type="button">▶ Přehrát</button><input id="sl" type="range" min="960" max="1320" value="1110" step="1" aria-label="Čas"><div class="clock" id="clk">18:30</div></div>
<h2>Distributoři</h2>
<div class="list" id="list"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
// Data: [příjezd HH:MM, název zastávky, zeměpisná šířka, délka]. Na zastávce stojí 5 minut.
var P=[50.1100,14.5000];
var D=[
{id:"D-01",car:"Dodávka NU-01",c:"#16a34a",s:[["17:00","Překladiště Vysočany",50.1100,14.5000],["17:25","Karlín",50.0930,14.4520],["17:50","Florenc",50.0905,14.4380],["18:20","Letná",50.0965,14.4195],["18:50","Dejvice",50.1005,14.3930],["19:30","Letiště Ruzyně",50.1008,14.2600],["20:30","Zličín",50.0540,14.2900],["21:10","Smíchov, Anděl",50.0710,14.4030]]},
{id:"D-02",car:"Dodávka NU-02",c:"#0ea5e9",s:[["17:10","Překladiště Vysočany",50.1100,14.5000],["17:40","Černý Most",50.1080,14.5750],["18:30","Palmovka",50.1043,14.4742],["19:00","Holešovice",50.1100,14.4400],["19:40","Staré Město",50.0875,14.4213],["20:15","Vyšehrad",50.0640,14.4190],["21:00","Pankrác",50.0520,14.4390]]},
{id:"D-03",car:"Dodávka NU-03",c:"#8b5cf6",s:[["16:50","Překladiště Vysočany",50.1100,14.5000],["17:30","Žižkov",50.0850,14.4540],["18:10","Vinohrady",50.0750,14.4375],["18:45","Nusle",50.0627,14.4380],["19:30","Chodov",50.0315,14.4910],["20:15","Háje",50.0320,14.5270],["21:00","Hostivař",50.0750,14.5350]]},
{id:"D-04",car:"Dodávka NU-04",c:"#f59e0b",s:[["17:20","Překladiště Vysočany",50.1100,14.5000],["17:50","Libeň",50.1070,14.4650],["18:25","Bubeneč",50.1040,14.4120],["19:05","Břevnov",50.0850,14.3560],["19:45","Motol",50.0740,14.3420],["20:30","Nové Butovice",50.0490,14.3490],["21:20","Smíchov, Anděl",50.0710,14.4030]]},
{id:"D-05",car:"Motorka NU-05",c:"#ef4444",s:[["17:00","Překladiště Vysočany",50.1100,14.5000],["17:20","Prosek",50.1260,14.5100],["17:55","Troja",50.1180,14.4250],["18:35","Holešovice",50.1100,14.4400],["19:10","Malá Strana",50.0880,14.4040],["19:50","Smíchov, Anděl",50.0710,14.4030],["20:40","Braník",50.0390,14.4150]]}
];
function m(t){var a=t.split(":");return +a[0]*60+ +a[1]}
function hm(x){x=Math.round(x);return Math.floor(x/60)+":"+("0"+x%60).slice(-2)}
D.forEach(function(d){d.p=d.s.map(function(s,i){return{a:m(s[0]),d:i<d.s.length-1?m(s[0])+5:m(s[0]),n:s[1],y:s[2],x:s[3]}})});
var map=L.map("map",{zoomControl:true}).setView([50.087,14.43],12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
function at(d,t){var p=d.p,i;
 if(t<=p[0].a)return{y:p[0].y,x:p[0].x,s:"Čeká na výjezd z: "+p[0].n,mv:0};
 var l=p[p.length-1]; if(t>=l.a)return{y:l.y,x:l.x,s:"Služba ukončena ("+l.n+")",mv:0};
 for(i=0;i<p.length-1;i++){
  if(t>=p[i].a&&t<p[i].d)return{y:p[i].y,x:p[i].x,s:"Stojí: "+p[i].n,mv:0};
  if(t>=p[i].d&&t<p[i+1].a){var f=(t-p[i].d)/(p[i+1].a-p[i].d);
   return{y:p[i].y+(p[i+1].y-p[i].y)*f,x:p[i].x+(p[i+1].x-p[i].x)*f,s:"V pohybu → "+p[i+1].n+" (příjezd "+hm(p[i+1].a)+")",mv:1}}}
 return{y:l.y,x:l.x,s:"",mv:0}}
var list=document.getElementById("list"),sel=null;
D.forEach(function(d){
 d.line=L.polyline(d.p.map(function(q){return[q.y,q.x]}),{color:d.c,weight:4,opacity:.8}).addTo(map);
 d.p.forEach(function(q){L.circleMarker([q.y,q.x],{radius:4,color:d.c,fillColor:"#fff",fillOpacity:1,weight:2}).addTo(map).bindTooltip(hm(q.a)+" · "+q.n)});
 d.mk=L.circleMarker([0,0],{radius:9,color:"#fff",weight:2,fillColor:d.c,fillOpacity:1}).addTo(map).bindTooltip(d.id,{permanent:true,direction:"top",offset:[0,-8]});
 var el=document.createElement("div");el.className="card";el.style.setProperty("--c",d.c);
 el.innerHTML='<h3>'+d.id+'<small>'+d.car+'</small></h3><p class="st"></p><div class="tt">'+d.p.map(function(q){return"<div><b>"+hm(q.a)+"</b><span>"+q.n+"</span></div>"}).join("")+"</div>";
 el.onclick=function(){sel=(sel===d)?null:d;draw()};d.el=el;list.appendChild(el)});
function draw(){var t=+sl.value;clk.textContent=hm(t);
 D.forEach(function(d){var r=at(d,t);d.mk.setLatLng([r.y,r.x]);d.el.querySelector(".st").textContent=r.s;
  d.el.classList.toggle("on",sel===d);d.line.setStyle({opacity:!sel||sel===d?.85:.2,weight:sel===d?6:4})});
 if(sel&&!draw.f){map.fitBounds(sel.line.getBounds(),{padding:[30,30]});draw.f=1}if(!sel)draw.f=0}
var sl=document.getElementById("sl"),clk=document.getElementById("clk"),pb=document.getElementById("play"),tm=null;
sl.oninput=draw;
pb.onclick=function(){if(tm){clearInterval(tm);tm=null;pb.textContent="▶ Přehrát";return}
 pb.textContent="⏸ Pauza";tm=setInterval(function(){var v=+sl.value+1;if(v>+sl.max)v=+sl.min;sl.value=v;draw()},120)};
draw();
})();
</script>
</body>
</html>
